# 本仓有**两个独立分发**，各自一份 pyproject：
# - 本文件 `sandbox-service`：通用沙箱服务本体
# - `sdk/pyproject.toml` 的 `std-agent-sdk`：agent 契约边界 SDK
#
# 分开的原因见 sdk/pyproject.toml 顶部——消费方（agent 镜像）只该装 SDK，
# 不该被迫拖上沙箱服务的源码与 fastapi/docker/minio 依赖。
#
#   pip install -e . -e sdk        # 开发（两个都装）
#   pip install -e ".[dev]" -e sdk # 带测试依赖

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-service"
version = "1.0.0"
description = "业务中立的通用 agent 沙箱服务：容器生命周期 + 通用端点代理 + 工作区快照，对 agent 协议零感知。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "docker>=7.0",
    "minio>=7.2",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.5"]

[tool.setuptools]
# 显式列出，避免 flat-layout 自动发现把 tests/deploy/docs 也当成包。
# std_agent_sdk 不在此列：它是 sdk/ 下的独立分发（见文件顶部）。
packages = ["sandbox_service"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
# echo_agent 供 conformance 自启作参考靶子，故也纳入 rootdir 的 import 路径；
# sdk/ 是 std_agent_sdk 的项目根，未装包时靠它 import（见 sdk/pyproject.toml）
pythonpath = [".", "sdk"]
testpaths = ["sandbox_service/tests", "sdk/std_agent_sdk/tests", "echo_agent/tests", "tests"]
